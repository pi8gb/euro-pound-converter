<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro to Pound Converter</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <h1>Euro to Pound Converter</h1>
    <p>Enter your value:</p>
    <input type="number" id="input" placeholder="Enter amount here">
    <button id="convertToggler">£ → €</button>
    <br><br>
    <button id="convertButton">Convert</button>
    <p>Result:</p>
    <p id="result"></p>
    <br>
    <div style="display: flex; gap: 5px;">
        <p>Rate:</p>
        <p id="rate">rate</p>
    </div>
    <div style="display: flex; gap: 5px; margin-top: -25px;">
        <p>Last Updated:</p>
        <p id="lastUpdated">last updated</p>
    </div>
    <button id="updateButton">Update rate</button>

    <script src="./script.js"></script>
</body>
</html>
